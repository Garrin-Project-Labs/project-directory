  name: "Project Directory"
  repo: "Garrin-Project-Labs/project-directory"
  sourceOfTruth: discord

owner:
  discordUserId: "222914128463921152"
  label: "ClickG"

discord:
  guildId: "1515020347425030245"
  channelId: "1519415648382353569"
  visibility: "public"
  projectsCategoryId: "1516195966330343444"
  projectCreationChannelId: "1516196374620799127"
  roles:
    viewer:
      roleId: "1519415640723558421"
      name: "directory-viewer"
    contributor:
      roleId: "1519415642996998224"
      name: "directory-contributor"
    maintainer:
